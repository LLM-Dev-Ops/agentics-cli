name: Capability Graph Validation
on:
  pull_request:
    paths:
      - 'docs/ecosystem.graph.json'
      - 'docs/ecosystem.fragments/**'
      - 'docs/ecosystem.graph.weights.json'
      - 'src/routing/graph-router.ts'
      - 'scripts/check-graph-resolver-coverage.ts'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Tier 1 — Offline validation
        run: npx @claude-flow/cli@latest graph validate --tier offline

      - name: Tier 2 — Repository checks
        run: npx @claude-flow/cli@latest graph validate --tier online
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ADR-PIPELINE-087 §8: block graph additions that reference agent names
      # the resolver does not know about. Prevents the silent-drop regression
      # class that ADR-PIPELINE-080..086 introduced from reaching main again.
      - name: Resolver coverage guard (ADR-PIPELINE-087 §8)
        run: npx tsx scripts/check-graph-resolver-coverage.ts
