version: "3.9"

services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: test_password_123
      APP_USER: supply_chain
      APP_USER_PASSWORD: supply_chain_pass
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      DB_HOST: oracle-xe
      DB_PORT: "1521"
      DB_USER: supply_chain
      DB_PASSWORD: supply_chain_pass
      DB_SERVICE_NAME: XEPDB1
      CRITICAL_DAYS_SUPPLY: "2"
      WARNING_DAYS_SUPPLY: "7"
      SURPLUS_DAYS_SUPPLY: "90"
      IMBALANCE_RATIO: "10"
      AUTO_ACTION_ENABLED: "false"
      ERP_READ_ONLY: "true"
      NETSUITE_BASE_URL: "https://netsuite.example.com"
      NETSUITE_SA_EMAIL: "netsuite-sa@project.iam.gserviceaccount.com"
    depends_on:
      oracle-xe:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  oracle-data:
