# ---------------------------------------------------------------------------
# Kubernetes Service — Agentics ERP Surface
#
# ClusterIP service exposing port 80, forwarding to container port 3000.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: erp-surface
  namespace: agentics
  labels:
    app.kubernetes.io/name: erp-surface
    app.kubernetes.io/part-of: agentics-platform
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: erp-surface
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
