# Cloud Build configuration for Agentics CLI
# Deploys to Google Cloud Run with secrets from Secret Manager

substitutions:
  _SERVICE_NAME: agentics-cli
  _REGION: us-central1
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _MEMORY: '512Mi'
  _CPU: '1'
  _CONCURRENCY: '80'

steps:
  # Build the container image (with npm token for private packages)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NPM_TOKEN=$$NPM_TOKEN \
          -t gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest \
          -f deploy/Dockerfile \
          .
    secretEnv: ['NPM_TOKEN']

  # Push the container images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

  # Deploy to Cloud Run with secrets from Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--concurrency'
      - '${_CONCURRENCY}'
      - '--set-env-vars'
      - 'NODE_ENV=production,SERVICE_NAME=agentics-cli'
      - '--set-secrets'
      - 'RUVECTOR_SERVICE_URL=RUVECTOR_SERVICE_URL:latest,RUVECTOR_API_KEY=RUVECTOR_API_KEY:latest,TELEMETRY_ENDPOINT=TELEMETRY_ENDPOINT:latest,PLATFORM_API_KEY=PLATFORM_API_KEY:latest,EXECUTION_HMAC_SECRET=EXECUTION_HMAC_SECRET:latest,RESULTS_INDEX_URL=RESULTS_INDEX_URL:latest'
      - '--labels'
      - 'app=agentics-cli,managed-by=cloud-build'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/npm-token/versions/latest
      env: 'NPM_TOKEN'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
